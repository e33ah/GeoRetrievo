name: georetrievo-ci

on: [push, pull_request, workflow_dispatch]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:

          dotnet-version: '10.0.x'

      - name: 'Run: BuildSolution'
        run: ./build.cmd BuildSolution

      - name: 'Run: ExecuteUnitTests'
        run: ./build.cmd ExecuteUnitTests --skip BuildSolution

      - name: 'Run: BuildUI'
        run: ./build.cmd BuildUI

      - name: 'Run: ExecuteUnitTestsUI'
        run: ./build.cmd ExecuteUnitTestsUI --skip BuildUI
