name: georetrievo-ui-cd

on: [workflow_dispatch]

jobs:
  build-and-deploy-ui:
    name: build-and-deploy-ui
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: 'Setup: Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/194067282433/locations/global/workloadIdentityPools/github-pool-01/providers/github-provider
          service_account: github-deploy-svc@georetrievo.iam.gserviceaccount.com

      - name: 'Setup: Google Cloud CLI'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: georetrievo

      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 'Run: BuildUI'
        run: bash ./build.sh BuildUI

      - name: 'Run: ExecuteUnitTestsUI'
        run: bash ./build.sh ExecuteUnitTestsUI --skip BuildUI
        
      - name: 'Run: BuildSolution'
        run: bash ./build.sh BuildSolution

      - name: 'Run: ExecuteUnitTests'
        run: bash ./build.sh ExecuteUnitTests --skip BuildSolution

      - name: 'Run: BuildUIImage'
        run: bash ./build.sh BuildUIImage --skip BuildUI ExecuteUnitTestsUI BuildSolution ExecuteUnitTests

      - name: 'Run: PushUIImage'
        run: bash ./build.sh PushUIImage --skip BuildUI ExecuteUnitTestsUI BuildUIImage

      - name: 'Run: ReleaseUI'
        run: bash ./build.sh ReleaseUI --skip BuildUI ExecuteUnitTestsUI BuildUIImage PushUIImage
