name: georetrievo-cd

on: [workflow_dispatch]

jobs:
  build-and-deploy:
    name: build-and-deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: 'Setup: Terraform'
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: 'Authenticate to Google Cloud'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/194067282433/locations/global/workloadIdentityPools/github-pool-01/providers/github-provider
          service_account: github-deploy-svc@georetrievo.iam.gserviceaccount.com

      - name: 'Setup: Google Cloud CLI'
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: georetrievo

      - name: 'Cache: .fallout/temp, ~/.nuget/packages'
        uses: actions/cache@v6
        with:
          path: |
            .fallout/temp
            ~/.nuget/packages
          key: ${{ runner.os }}-${{ hashFiles('**/global.json', '**/*.csproj', '**/Directory.Packages.props') }}

      - name: 'Setup: .NET SDK'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: 'Run: BuildSolution'
        run: bash ./build.sh BuildSolution

      - name: 'Run: ExecuteUnitTests'
        run: bash ./build.sh ExecuteUnitTests --skip BuildSolution
        
      - name: 'Run: BuildAPIImage'
        run: bash ./build.sh BuildAPIImage --skip BuildSolution ExecuteUnitTests

      - name: 'Run: PushAPIImage'
        run: bash ./build.sh PushAPIImage --skip BuildSolution ExecuteUnitTests BuildAPIImage

      - name: 'Run: ReleaseAPI'
        run: bash ./build.sh ReleaseAPI --skip BuildSolution ExecuteUnitTests BuildAPIImage PushAPIImage
